name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  quality:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Verify vendored SDK assets
        run: make verify-sdk

      - name: Run ReaderCore tests
        run: make test-readercore

      - name: Lint Swift code
        run: make lint

      - name: Run app tests
        run: make test

  release:
    runs-on: macos-latest
    timeout-minutes: 60
    needs: quality
    steps:
      - name: Create GitHub App token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: BlankGrimoire
          repositories: BlankGrimoire-iOS

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
          GIT_AUTHOR_NAME: BlankGrimoire contributors
          GIT_AUTHOR_EMAIL: blankgrimoire.dev@gmail.com
          GIT_COMMITTER_NAME: BlankGrimoire contributors
          GIT_COMMITTER_EMAIL: blankgrimoire.dev@gmail.com
        run: npx semantic-release
