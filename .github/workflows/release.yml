name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js for semantic-release
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/exec @semantic-release/github conventional-changelog-conventionalcommits

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: make generate

      - name: Build and archive
        run: |
          xcodebuild archive \
            -scheme BlankGrimoire \
            -destination 'generic/platform=iOS' \
            -archivePath build/BlankGrimoire.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/BlankGrimoire.xcarchive \
            -exportPath build/Export \
            -exportOptionsPlist ExportOptions.plist

      - name: Create dSYM zip
        run: |
          cd build/BlankGrimoire.xcarchive/dSYMs
          zip -r ../../BlankGrimoire.dSYM.zip .

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp build/Export/BlankGrimoire.ipa release/
          cp build/BlankGrimoire.dSYM.zip release/

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: BlankGrimoire contributors
          GIT_AUTHOR_EMAIL: blankgrimoire.dev@gmail.com
          GIT_COMMITTER_NAME: BlankGrimoire contributors
          GIT_COMMITTER_EMAIL: blankgrimoire.dev@gmail.com
        run: >-
          npx --yes
          -p semantic-release@24
          -p @semantic-release/changelog@6
          -p @semantic-release/git@10
          -p @semantic-release/exec@6
          -p conventional-changelog-conventionalcommits@8
          semantic-release