name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  quality:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Verify vendored SDK assets
        run: make verify-sdk

      - name: Run ReaderCore tests
        run: make test-readercore

      - name: Lint Swift code
        run: make lint

      - name: Run app tests
        run: make test

  release:
    runs-on: macos-latest
    timeout-minutes: 60
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: BlankGrimoire contributors
          GIT_AUTHOR_EMAIL: blankgrimoire.dev@gmail.com
          GIT_COMMITTER_NAME: BlankGrimoire contributors
          GIT_COMMITTER_EMAIL: blankgrimoire.dev@gmail.com
        run: npx semantic-release
