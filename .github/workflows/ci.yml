name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Verify vendored SDK assets
        run: make verify-sdk

      - name: Run ReaderCore tests
        run: make test-readercore

      - name: Lint Swift code
        run: make lint

      - name: Run app tests
        run: make test

  build:
    runs-on: macos-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build app
        run: make build DESTINATION='generic/platform=iOS Simulator'
